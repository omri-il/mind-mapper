<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>מפת חשיבה — כלי מפות חשיבה בעברית</title>
  <meta name="description" content="כלי חינמי ליצירת מפות חשיבה בעברית — צבעוני, אינטואיטיבי, עם בינה מלאכותית ומצב מצגת." />

  <!-- Hebrew fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@400;500;700;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- mind-elixir core stylesheet (pinned major) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mind-elixir@5/dist/MindElixir.css" />

  <link rel="stylesheet" href="css/style.css?v=6" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <!-- Top toolbar (core canvas actions only) -->
  <header class="toolbar" id="toolbar">
    <div class="tb-group tb-brand">
      <button class="tb-btn tb-maps" id="btnMaps" title="המפות שלי">
        <span class="ic">🗂️</span><span class="lbl" id="currentMapTitle">מפה חדשה</span>
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group" aria-label="עריכת צמתים">
      <button class="tb-btn" id="btnAddChild" title="הוסף ענף-בן (Tab)"><span class="ic">➕</span><span class="lbl">בן</span></button>
      <button class="tb-btn" id="btnAddSibling" title="הוסף ענף-אח (Enter)"><span class="ic">↔️</span><span class="lbl">אח</span></button>
      <button class="tb-btn" id="btnEdit" title="ערוך טקסט (F2)"><span class="ic">✏️</span><span class="lbl">ערוך</span></button>
      <button class="tb-btn" id="btnDelete" title="מחק (Delete)"><span class="ic">🗑️</span><span class="lbl">מחק</span></button>
    </div>

    <div class="tb-sep"></div>

    <div class="tb-group" aria-label="תצוגה">
      <button class="tb-btn" id="btnZoomOut" title="הקטן"><span class="ic">➖</span></button>
      <button class="tb-btn" id="btnZoomIn" title="הגדל"><span class="ic">➕</span></button>
      <button class="tb-btn" id="btnFit" title="התאם לחלון"><span class="ic">🎯</span><span class="lbl">מרכז</span></button>
      <button class="tb-btn" id="btnDir" title="כיוון פריסה (ימין/שמאל/דו-צדדי)"><span class="ic">↤</span><span class="lbl">כיוון</span></button>
    </div>

    <div class="tb-spacer"></div>

    <div class="tb-group" aria-label="קובץ">
      <button class="tb-btn" id="btnNew" title="מפה חדשה"><span class="ic">📄</span><span class="lbl">חדש</span></button>
      <div class="tb-pop-wrap">
        <button class="tb-btn" id="btnExport" title="ייצוא"><span class="ic">⬇️</span><span class="lbl">ייצוא</span></button>
        <div class="popover popover-end" id="popExport" hidden>
          <button class="link-btn" data-export="png">תמונה (PNG)</button>
          <button class="link-btn" data-export="svg">וקטור (SVG)</button>
          <button class="link-btn" data-export="json">קובץ מפה (JSON)</button>
          <button class="link-btn" data-export="md">Markdown</button>
          <button class="link-btn" data-export="opml">OPML</button>
        </div>
      </div>
      <button class="tb-btn" id="btnImport" title="פתח קובץ JSON"><span class="ic">📂</span></button>
    </div>

    <div class="tb-sep"></div>
    <button class="tb-btn tb-present" id="btnPresent" title="מצגת — זום לכל רעיון (Esc ליציאה)"><span class="ic">▶</span><span class="lbl">מצגת</span></button>
    <button class="tb-btn tb-side-toggle" id="btnSidebar" title="הצג/הסתר פאנל"><span class="ic">⮜</span></button>
  </header>

  <!-- Workspace: map + sidebar -->
  <div class="workspace">
    <main id="map" class="map"></main>

    <aside class="sidebar" id="sidebar">
      <nav class="side-rail">
        <button class="rail-btn active" data-tab="maps" title="המפות שלי">🗂️</button>
        <button class="rail-btn" data-tab="format" title="עיצוב הצומת">🎨</button>
        <button class="rail-btn" data-tab="ai" title="בינה מלאכותית">✨</button>
        <button class="rail-btn" data-tab="outline" title="מתאר">📋</button>
      </nav>

      <div class="side-body">
        <!-- Maps -->
        <section class="side-pane" data-pane="maps">
          <div class="pane-head"><h2>המפות שלי</h2></div>
          <button class="pane-cta" id="paneNewMap">➕ מפה חדשה</button>
          <ul class="maps-list" id="mapsList"></ul>
        </section>

        <!-- Format selected node -->
        <section class="side-pane" data-pane="format" hidden>
          <div class="pane-head"><h2>עיצוב הצומת</h2></div>
          <p class="fmt-target" id="fmtTarget">לא נבחר צומת</p>

          <div class="fmt-block">
            <label>צבע</label>
            <div class="swatches" id="fmtColors"></div>
            <button class="mini-btn" id="fmtClearColor">נקה צבע</button>
          </div>

          <div class="fmt-block">
            <label>אייקון</label>
            <div class="emoji-grid" id="fmtEmoji"></div>
            <button class="mini-btn" id="fmtClearIcon">הסר אייקון</button>
          </div>

          <div class="fmt-block">
            <label>גודל טקסט</label>
            <div class="fmt-row">
              <button class="mini-btn" id="fmtFontDown">A−</button>
              <button class="mini-btn" id="fmtFontUp">A＋</button>
            </div>
          </div>

          <div class="fmt-block">
            <label>סגנון המפה</label>
            <div class="theme-opts">
              <button class="theme-opt" data-theme="clean"><b>נקי ומודרני</b><small>עדין ומסודר</small></button>
              <button class="theme-opt" data-theme="playful"><b>אורגני וצבעוני</b><small>חי ומודגש</small></button>
            </div>
          </div>
        </section>

        <!-- AI -->
        <section class="side-pane" data-pane="ai" hidden>
          <div class="pane-head"><h2>✨ בינה מלאכותית</h2></div>
          <div class="seg" id="aiSeg">
            <button class="seg-btn active" data-mode="generate">מרעיון</button>
            <button class="seg-btn" data-mode="source">מהטקסט שלי</button>
          </div>
          <textarea id="aiInput" rows="6" placeholder="על מה המפה? לדוגמה: שיעור על פוטוסינתזה לכיתה ז'"></textarea>
          <p class="pane-hint" id="aiHint">המפה תיווצר כמפה חדשה ולא תדרוס את הנוכחית.</p>
          <button class="btn-primary" id="aiGo">צור מפה</button>
          <div class="ai-busy" id="aiBusy" hidden><span class="spinner"></span> בונה את המפה…</div>
          <hr class="pane-div" />
          <button class="pane-cta alt" id="btnExpand">🪄 הרחב את הצומת הנבחר</button>
          <p class="pane-hint">בחר צומת במפה ולחץ כדי להוסיף לו תתי-נושאים מה-AI.</p>
        </section>

        <!-- Outline -->
        <section class="side-pane" data-pane="outline" hidden>
          <div class="pane-head"><h2>מתאר</h2></div>
          <ul class="outline-list" id="outlineList"></ul>
        </section>
      </div>
    </aside>
  </div>

  <!-- Presentation overlay -->
  <div class="present-caption" id="presCaption" hidden></div>
  <div class="presenter-bar" id="presenterBar" hidden>
    <button id="presPrev" title="הקודם (←)">◀</button>
    <span id="presCount">1 / 1</span>
    <button id="presNext" title="הבא (→ / רווח)">▶</button>
    <button id="presOverview" title="מבט-על (Home)">🗺️</button>
    <button id="presExit" title="יציאה (Esc)">✕</button>
  </div>

  <!-- Hidden file input for import -->
  <input type="file" id="fileInput" accept="application/json,.json,.mindmap.json" hidden />

  <!-- Toasts -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=6"></script>
</body>
</html>
